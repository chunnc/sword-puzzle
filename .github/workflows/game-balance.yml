name: Game maps and balance
on:
  pull_request:
    paths: ['content/**', 'client/src/game/**', 'client/src/state/**', 'server/**', 'tools/*maps*', 'tools/game-runtime.cjs', 'tools/*balance_report.cjs', 'tools/*content_cache*', 'package.json', '.github/workflows/game-balance.yml']
  push:
    branches: [main]
    paths: ['content/**', 'client/src/game/**', 'server/**', 'tools/*maps*', 'tools/game-runtime.cjs', 'tools/*balance_report.cjs', 'tools/*content_cache*', 'package.json', '.github/workflows/game-balance.yml']
  workflow_dispatch:
jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - run: npm --prefix client run typecheck
      - run: npm --prefix client test -- --silent
      - run: npm --prefix server test
      - run: node tools/seed_game_content.mjs
      - run: npm run maps:test
